<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregando...</title>

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400&family=Space+Grotesk:wght@300;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
    
    <style>
        /* Estilos para a Janela Desdobrável (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: all 0.3s ease;
            z-index: 9999;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-box {
            background: #fff; padding: 30px; border-radius: 12px;
            max-width: 500px; width: 90%; text-align: center; position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); color: #333;
        }
        .modal-close {
            position: absolute; top: 15px; right: 20px;
            font-size: 24px; cursor: pointer; background: none; border: none; color: #666;
        }
        .modal-img { max-height: 200px; margin-bottom: 15px; border-radius: 8px; }
        .modal-desc { font-size: 15px; color: #555; margin: 15px 0; line-height: 1.5; }
        .modal-price { font-size: 20px; font-weight: bold; color: #222; display: block; margin-bottom: 20px; }
        .whatsapp-btn {
            display: inline-block; background: #25D366; color: #fff;
            padding: 12px 25px; border-radius: 30px; text-decoration: none;
            font-weight: 500; font-family: 'Space Grotesk', sans-serif; transition: background 0.2s;
        }
        .whatsapp-btn:hover { background: #20ba59; }
        .product-card { cursor: pointer; }

        /* Estilos para o Rodapé (Footer) */
        .site-footer {
            background: #111; color: #888; padding: 30px 20px;
            text-align: center; font-size: 14px; margin-top: 60px;
            border-top: 1px solid #222; font-family: 'Inter', sans-serif;
        }
        .site-footer p { margin: 5px 0; }
        .footer-tech { font-size: 12px; color: #555; margin-top: 10px !important; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo-container">
            <img id="logo" src="" alt="Logo" class="logo-img">
        </div>
        <ul class="nav-links">
            <li><a href="#projetos">Projetos</a></li>
            <li><a href="#sobre">Sobre</a></li>
            <li><a href="#licenciamento">Licenciamento</a></li>
        </ul>
        <a href="#loja" class="nav-shop">Loja 🛒</a>
    </nav>

    <!-- HERO -->
    <section class="hero" id="sobre">
        <div class="hero-container">
            <div class="hero-content">
                <span class="hero-tag" id="hero-tag"></span>
                <h1 class="hero-title">
                    <span id="hero-titulo"></span>
                    <span id="hero-titulo-destaque"></span>
                </h1>
                <p class="hero-description" id="hero-descricao"></p>
                <a id="hero-botao" href="#" class="cta-button"></a>
            </div>
            <div class="hero-visual">
                <div class="planet-bg">
                    <img id="hero-personagem" src="" alt="" class="character-img">
                </div>
            </div>
        </div>
    </section>

    <!-- PROJETOS -->
    <section class="projects-section" id="projetos">
        <div class="section-header">
            <h2 class="section-title">
                <span id="projetos-titulo"></span> <span id="projetos-titulo-destaque"></span>
            </h2>
            <p class="section-subtitle" id="projetos-subtitulo"></p>
        </div>
        <div class="projects-grid" id="projects-grid"></div>
    </section>

    <!-- LOJA -->
    <section class="shop-section" id="loja">
        <div class="section-header">
            <h2 class="section-title">
                <span id="loja-titulo"></span> <span id="loja-titulo-destaque"></span>
            </h2>
            <p class="section-subtitle" id="loja-subtitulo"></p>
        </div>
        <div class="shop-grid" id="shop-grid"></div>
    </section>

    <!-- JANELA DESDOBRÁVEL (MODAL) COM SEU LOGO DO WHATSAPP -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">×</button>
            <img id="modalImg" src="" alt="" class="modal-img">
            <h3 id="modalTitle" style="font-family: 'Space Grotesk', sans-serif; font-size: 22px;"></h3>
            <p id="modalDesc" class="modal-desc"></p>
            <span id="modalPrice" class="modal-price"></span>
            <a id="modalWhatsapp" href="#" target="_blank" class="whatsapp-btn">
                <img src="logo-whatsapp.png" alt="WhatsApp" style="width: 24px; height: 24px; vertical-align: middle; margin-right: 8px;">
                Comprar pelo WhatsApp 💬
            </a>
        </div>
    </div>

    <!-- RODAPÉ DO SITE (FOOTER) -->
    <footer class="site-footer">
        <p>&copy; <span id="footer-ano"></span> <span id="footer-nome"></span>. Todos os direitos reservados.</p>
        <p><span id="footer-pais"></span></p>
        <p class="footer-tech">Desenvolvido com <span id="footer-tech"></span> hospedado via GitHub Pages.</p>
    </footer>

    <!-- Carrega o conteúdo do data.js -->
    <script src="data.js"></script>
    <script>
        const d = SITE_DATA;

        // Título da aba e Logo
        document.title = d.config.titulo_aba;
        document.getElementById('logo').src = d.config.logo;

        // Hero
        document.getElementById('hero-tag').textContent = d.hero.tag;
        document.getElementById('hero-titulo').textContent = d.hero.titulo;
        document.getElementById('hero-titulo-destaque').textContent = d.hero.titulo_destaque;
        document.getElementById('hero-descricao').textContent = d.hero.descricao;
        document.getElementById('hero-botao').textContent = d.hero.botao_texto;
        document.getElementById('hero-botao').href = d.hero.botao_link;
        document.getElementById('hero-personagem').src = d.hero.personagem_img;
        document.getElementById('hero-personagem').alt = d.hero.personagem_alt;

        // Projetos
        document.getElementById('projetos-titulo').textContent = d.projetos.titulo;
        document.getElementById('projetos-titulo-destaque').textContent = d.projetos.titulo_destaque;
        document.getElementById('projetos-subtitulo').textContent = d.projetos.subtitulo;

        const projectsGrid = document.getElementById('projects-grid');
        d.projetos.lista.forEach(projeto => {
            projectsGrid.innerHTML += `
                <div class="project-card">
                    <div class="project-media">
                        <span class="tv-badge">${projeto.badge}</span>
                        <img src="${projeto.imagem}" alt="${projeto.alt}">
                    </div>
                    <div class="project-info">
                        <span class="project-meta">${projeto.meta}</span>
                        <h3 class="project-name">${projeto.nome}</h3>
                        <p class="project-desc">${projeto.descricao}</p>
                    </div>
                </div>`;
        });

        // Loja
        document.getElementById('loja-titulo').textContent = d.loja.titulo;
        document.getElementById('loja-titulo-destaque').textContent = d.loja.titulo_destaque;
        document.getElementById('loja-subtitulo').textContent = d.loja.subtitulo;

        const shopGrid = document.getElementById('shop-grid');
        d.loja.lista.forEach((produto, index) => {
            shopGrid.innerHTML += `
                <div class="product-card" onclick="openModal(${index})">
                    <div class="product-media">
                        <img src="${produto.imagem}" alt="${produto.alt}" class="product-img">
                    </div>
                    <h4 class="product-title">${produto.nome}</h4>
                    <span class="product-price">${produto.preco}</span>
                </div>`;
        });

        // Rodapé dinâmico
        document.getElementById('footer-ano').textContent = d.rodape.ano;
        document.getElementById('footer-nome').textContent = d.rodape.autor;
        document.getElementById('footer-pais').textContent = d.rodape.pais_cidade;
        document.getElementById('footer-tech').textContent = d.rodape.tecnologia;

        // Funções para controlar a Janela Desdobrável
        function openModal(index) {
            const produto = d.loja.lista[index];
            document.getElementById('modalImg').src = produto.imagem;
            document.getElementById('modalImg').alt = produto.alt;
            document.getElementById('modalTitle').textContent = produto.nome;
            document.getElementById('modalDesc').textContent = produto.caracteristicas || "Colecionável oficial de alta qualidade.";
            document.getElementById('modalPrice').textContent = produto.preco;
            
            // Link do WhatsApp montado corretamente com as variáveis internas do JavaScript
            const numeroWhats = d.config.whatsapp_numero;
            const textoMensagem = encodeURIComponent(`Olá! Visitei seu site e gostaria de comprar a ${produto.nome} por ${produto.preco}.`);
            document.getElementById('modalWhatsapp').href = `https://wa.me{numeroWhats}?text=${textoMensagem}`;
            
            document.getElementById('productModal').classList.add('active');
        }

        function closeModal() {
